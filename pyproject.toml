[project]
name = "momo-watch"
version = "0.1.0"
description = "momo 購物網商品庫存監控與半自動下單"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    # Windows 沒有系統 IANA 時區資料庫，zoneinfo 查 "Asia/Taipei" 會直接失敗。
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Phase 2 的下單流程才需要瀏覽器；只做監控的話不用裝。
buy = [
    "playwright>=1.44",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "playwright>=1.44",
]

[project.scripts]
momo-watch = "momo_watch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/momo_watch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
